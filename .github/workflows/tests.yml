name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation2 fonts-dejavu-core tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
